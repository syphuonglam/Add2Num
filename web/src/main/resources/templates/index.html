<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add2Num</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="p-4">
<div class="container">
    <h1 class="mb-4">Add2Num — Large Number Addition</h1>

    <form method="post" action="/add">
        <div class="mb-3">
            <label class="form-label">Number A</label>
            <textarea class="form-control" name="a" rows="2" placeholder="Enter large number">[[${a}]]</textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Number B</label>
            <textarea class="form-control" name="b" rows="2" placeholder="Enter large number">[[${b}]]</textarea>
        </div>
        <button class="btn btn-primary" type="submit">Calculate</button>
    </form>

    <div th:if="${result}" class="mt-4">
        <h3>Result</h3>
        <pre class="p-3 result-box">[[${result}]]</pre>

        <h4 class="mt-3">Calculation Steps</h4>
        <ol>
            <li th:each="step : ${steps}">[[${step}]]</li>
        </ol>
    </div>
</div>
</body>
</html>
